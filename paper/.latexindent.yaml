defaultIndent: "  "

modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1

  textWrapOptions:
    columns: 80
    multipleSpacesToSingle: 1

  oneSentencePerLine:
    manipulateSentences: 0

lookForAlignDelims:
  align:
    delims: 1
    alignDoubleBackSlash: 1
    spacesBeforeDoubleBackSlash: 1

  align*:
    delims: 1
    alignDoubleBackSlash: 1
    spacesBeforeDoubleBackSlash: 1

  aligned:
    delims: 1
    alignDoubleBackSlash: 1

  cases:
    delims: 1
    alignDoubleBackSlash: 1